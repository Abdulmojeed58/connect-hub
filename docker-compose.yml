services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connecthub
      POSTGRES_PASSWORD: connecthub
      POSTGRES_DB: connecthub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecthub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: http://localhost
      FRONTEND_URL: http://localhost
      # Override with local Docker database — no external DB needed
      DATABASE_URL: postgresql://connecthub:connecthub@db:5432/connecthub
      DIRECT_URL: postgresql://connecthub:connecthub@db:5432/connecthub
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 80
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
